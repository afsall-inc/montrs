[package]
name = "{{crate_name}}"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "2"

[dependencies]
montrs-desktop = { path = "{{project-name}}/packages/desktop" }

[[bin]]
name = "{{crate_name}}"
path = "src/main.rs"

# Dev hot-reload profile: optimized like `release`, but with debug assertions so
# the WASM client emits the same hot-reload markers as the dev SSR server.
# `montrs serve` builds the frontend with this profile.
[profile.hot]
inherits = "release"
debug-assertions = true
debug = false
incremental = true