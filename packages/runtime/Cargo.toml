[package]
name = "montrs-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MontRS runtime — general-purpose Rust runtime with ops, extensions, resource table, and event loop"

[package.metadata.montrs]
layer = "0"
allowed_deps = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow.workspace = true
tokio = { workspace = true, features = ["full"] }
async-trait.workspace = true
dashmap = "5"
futures.workspace = true
sha2 = "0.10"
hex = "0.4"
once_cell = "1"
parking_lot = "0.12"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"