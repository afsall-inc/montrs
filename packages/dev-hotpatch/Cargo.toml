[package]
name = "montrs-dev-hotpatch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust hot-patching foundation for the MontRS dev server (subsecond interop)"

[package.metadata.montrs]
layer = "2"
allowed_deps = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
subsecond-types = "0.7"
ar = "0.9"
# Object files are read (symbols) and written (undefined-symbol stubs) on every
# platform, so this is a normal dependency rather than target-gated.
object = { version = "0.36", default-features = false, features = ["read", "write", "std"] }

# MSVC keeps a binary's symbols in a sibling .pdb.
[target.'cfg(windows)'.dependencies]
pdb = "0.8"

[lib]
path = "src/lib.rs"

[[bin]]
name = "montrs-rustc-wrapper"
path = "src/bin/montrs-rustc-wrapper.rs"

[[bin]]
name = "montrs-link-wrapper"
path = "src/bin/montrs-link-wrapper.rs"

[[bin]]
name = "montrs-hotpatch-relink"
path = "src/bin/montrs-hotpatch-relink.rs"

[[bin]]
name = "montrs-hotpatch-build"
path = "src/bin/montrs-hotpatch-build.rs"
