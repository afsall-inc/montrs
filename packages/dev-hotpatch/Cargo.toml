[package]
name = "montrs-dev-hotpatch"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Rust hot-patching foundation for the MontRS dev server (subsecond interop)"

[package.metadata.montrs]
layer = "2"
allowed_deps = []

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
subsecond-types = "0.7"

# Symbol extraction from the fat (running) binary: MSVC keeps symbols in a
# sibling .pdb; other platforms keep them in the object file.
[target.'cfg(windows)'.dependencies]
pdb = "0.8"

[target.'cfg(not(windows))'.dependencies]
object = { version = "0.36", default-features = false, features = ["read"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "montrs-rustc-wrapper"
path = "src/bin/montrs-rustc-wrapper.rs"

[[bin]]
name = "montrs-link-wrapper"
path = "src/bin/montrs-link-wrapper.rs"
