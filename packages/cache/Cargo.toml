[package]
name = "montrs-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Content-addressed incremental cache for MontRS build steps and tasks"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-core"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow.workspace = true
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
glob = "0.3"
fs2 = "0.4"
montrs-core = { path = "../core" }

[dev-dependencies]
tempfile = "3"
