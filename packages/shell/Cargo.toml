[package]
name = "montrs-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MontRS shell integration — activation, shims, completions"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-tool", "montrs-env"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
anyhow.workspace = true
dirs = "5"
montrs-tool = { path = "../tool" }
montrs-env = { path = "../env" }

[dev-dependencies]
tempfile = "3"