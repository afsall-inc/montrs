[package]
name = "montrs-lockfile"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 OR MIT"
authors.workspace = true
repository.workspace = true
description = "MontRS lockfile — deterministic tool version locking"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-registry"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
fslock = "0.2"
dirs = "5"
indexmap = { version = "2", features = ["serde"] }
montrs-registry = { path = "../registry" }

[dev-dependencies]
tempfile = "3"