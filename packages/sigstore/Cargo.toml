[package]
name = "montrs-sigstore"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 OR MIT"
authors.workspace = true
repository.workspace = true
description = "Signature verification for MontRS — cosign, SLSA, GitHub attestations"

[package.metadata.montrs]
layer = "2"
allowed_deps = []

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["fs", "io-util", "time"] }
async-trait.workspace = true
x509-cert = { version = "0.3", default-features = false, features = ["std", "pem"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = "1"

[dev-dependencies]
tempfile = "3"