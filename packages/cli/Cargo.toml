[package]
name = "montrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-core", "montrs-agent", "montrs-agentignore", "montrs-bench", "montrs-fmt", "montrs-utils", "montrs-runner", "montrs-metadata", "montrs-build", "montrs-env", "montrs-lockfile", "montrs-shell", "montrs-services", "montrs-log", "montrs-auth", "montrs-tool"]

[[bin]]
name = "montrs"
path = "src/bin/montrs.rs"

[features]
default = []
auth = ["dep:montrs-auth"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yml = "0.0.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
tracing.workspace = true
tracing-subscriber = "0.3"
console = "0.15"
camino = "1.1"
which = "6.0"
shlex = "1.3"
fs_extra = "1.3"

tempfile = "3.10"
toml = "0.9.11"
clap_complete = "4.5.65"
ignore = "0.4"
walkdir = "2.5"
montrs-core = { path = "../core" }
montrs-agent = { path = "../agent" }
montrs-agentignore = { path = "../agentignore" }
montrs-bench = { path = "../bench" }
montrs-fmt = { path = "../fmt" }
montrs-utils = { path = "../utils" }
montrs-runner = { path = "../runner" }
montrs-metadata = { path = "../metadata" }
montrs-build = { path = "../build" }
montrs-env = { path = "../env" }
montrs-lockfile = { path = "../lockfile" }
montrs-shell = { path = "../shell" }
montrs-services = { path = "../services" }
montrs-log = { path = "../log" }
montrs-auth = { path = "../auth", optional = true }
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
kstring = { workspace = true }
montrs-tool = { path = "../tool" }
