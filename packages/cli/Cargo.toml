[package]
name = "montrs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-core", "montrs-agent", "montrs-agentignore", "montrs-bench", "montrs-fmt", "montrs-utils", "montrs-runner", "montrs-metadata", "montrs-build", "montrs-env", "montrs-lockfile"]

[[bin]]
name = "montrs"
path = "src/bin/montrs.rs"

[features]
default = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
thiserror.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
tracing-subscriber = "0.3"
console = "0.15"
indicatif = "0.17"
camino = "1.1"
cargo_metadata = "0.18"
which = "6.0"
shlex = "1.3"
fs_extra = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
cargo-generate = "0.23"
openssl = { version = "0.10", features = ["vendored"] }
config = "0.14"
tempfile = "3.10"
toml = "0.9.11"
quick-xml = "0.39.0"
clap_complete = "4.5.65"
ignore = "0.4"
walkdir = "2.5"
montrs-core = { path = "../core" }
montrs-agent = { path = "../agent" }
montrs-agentignore = { path = "../agentignore" }
montrs-bench = { path = "../bench" }
montrs-fmt = { path = "../fmt" }
montrs-utils = { path = "../utils" }
montrs-runner = { path = "../runner" }
montrs-metadata = { path = "../metadata" }
montrs-build = { path = "../build" }
montrs-env = { path = "../env" }
montrs-lockfile = { path = "../lockfile" }
colored = "2.1"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
