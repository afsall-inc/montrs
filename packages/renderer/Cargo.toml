[package]
name = "montrs-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform rendering engine for MontRS — wgpu GPU backend + tiny-skia CPU fallback"

[package.metadata.montrs]
layer = "3"
allowed_deps = []

[dependencies]
wgpu = { version = "0.19", optional = true }
tiny-skia = { version = "0.11", optional = true }
winit = { version = "0.30", optional = true }
cosmic-text = { version = "0.12", optional = true }
glyphon = { version = "0.5", optional = true }
resvg = { version = "0.44", optional = true }
usvg = { version = "0.44", optional = true }
image = { version = "0.25", optional = true }
lyon = { version = "1.0", optional = true }
bytemuck = { version = "1", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = "0.1"

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu", "dep:winit", "dep:lyon", "dep:glyphon"]
tiny-skia-backend = ["dep:tiny-skia", "dep:lyon"]
text = ["dep:cosmic-text", "dep:glyphon"]
svg = ["dep:resvg", "dep:usvg", "dep:tiny-skia"]
images = ["dep:image"]
full = ["wgpu-backend", "tiny-skia-backend", "text", "svg", "images"]