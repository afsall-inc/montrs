[package]
name = "montrs-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform rendering engine for MontRS — wgpu GPU backend + tiny-skia CPU fallback"

[dependencies]
wgpu = { version = "0.19", optional = true }
tiny-skia = { version = "0.11", optional = true }
winit = { version = "0.30", optional = true }
cosmic-text = { version = "0.12", optional = true }
resvg = { version = "0.44", optional = true }
image = { version = "0.25", optional = true }
bytemuck = { version = "1", features = ["derive"] }
serde.workspace = true
thiserror.workspace = true

[features]
default = ["wgpu-backend"]
wgpu-backend = ["dep:wgpu", "dep:winit"]
tiny-skia-backend = ["dep:tiny-skia"]
text = ["dep:cosmic-text"]
svg = ["dep:resvg"]
images = ["dep:image"]
full = ["wgpu-backend", "tiny-skia-backend", "text", "svg", "images"]