[package]
name = "montrs-deps"
version.workspace = true
edition.workspace = true
license = "Apache-2.0 OR MIT"
authors.workspace = true
repository.workspace = true
description = "MontRS dependency management — [deps] section processing"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-metadata"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow.workspace = true
toml = "0.9"
sha2 = "0.10"
hex = "0.4"
walkdir = "2.5"
montrs-metadata = { path = "../metadata" }

[dev-dependencies]
tempfile = "3"