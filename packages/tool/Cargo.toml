[package]
name = "montrs-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MontRS tool version manager"

[package.metadata.montrs]
layer = "2"
allowed_deps = ["montrs-registry", "montrs-lockfile", "montrs-sigstore", "montrs-plugin"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
anyhow.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["fs", "process", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
dirs = "5"
indexmap = { version = "2", features = ["serde"] }
montrs-registry = { path = "../registry" }
montrs-lockfile = { path = "../lockfile" }
montrs-sigstore = { path = "../sigstore" }
montrs-plugin = { path = "../plugin" }

[dev-dependencies]
tempfile = "3"