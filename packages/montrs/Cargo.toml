[package]
name = "montrs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The main entry point for the MontRS framework."

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-platform", "montrs-web", "montrs-edge", "montrs-core", "montrs-haptics", "montrs-orm", "montrs-validator", "montrs-test", "montrs-cli", "montrs-icons", "montrs-ui", "montrs-motion", "montrs-renderer", "montrs-desktop", "montrs-mobile"]

[dependencies]
montrs-platform = { path = "../platform", version = "0.1.0" }
montrs-web = { path = "../web", version = "0.1.0", optional = true }
montrs-edge = { path = "../edge", version = "0.1.0", optional = true }
montrs-haptics = { path = "../haptics", optional = true }
montrs-core = { path = "../core", version = "0.1.0" }
montrs-orm = { path = "../orm", version = "0.1.0", optional = true }
montrs-validator = { path = "../validator", version = "0.1.0", optional = true }
montrs-test = { path = "../test", version = "0.1.0", optional = true }
montrs-cli = { path = "../cli", version = "0.1.0", optional = true }
montrs-icons = { path = "../icons", version = "0.1.0", optional = true }
montrs-ui = { path = "../ui", version = "0.1.0", optional = true }
montrs-motion = { path = "../motion", version = "0.1.0", optional = true }
montrs-renderer = { path = "../renderer", version = "0.1.0", optional = true }
montrs-desktop = { path = "../desktop", version = "0.1.0", optional = true }
montrs-mobile = { path = "../mobile", version = "0.1.0", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = "0.1"

[[bin]]
name = "montrs"
path = "src/bin/montrs.rs"
required-features = ["cli"]

[features]
haptics = ["dep:montrs-haptics"]
default = ["full"]

# Enable the entire framework including the CLI
full = ["orm", "validator", "test", "cli", "icons", "ui", "motion"]

# Basic package activation
orm = ["dep:montrs-orm"]
validator = ["dep:montrs-validator"]
test = ["dep:montrs-test"]
cli = ["dep:montrs-cli"]
icons = ["dep:montrs-icons"]
ui = ["dep:montrs-ui", "icons"]
motion = ["dep:montrs-motion"]
renderer = ["dep:montrs-renderer"]
desktop = ["dep:montrs-desktop", "renderer"]
mobile = ["dep:montrs-mobile", "renderer"]
web = ["dep:montrs-web"]
edge = ["dep:montrs-edge"]

# --- Forwarded Features ---

# Forwarding 'sqlite' to 'montrs-orm/sqlite'
# Note: This also ensures the 'orm' package itself is enabled
sqlite = ["orm", "montrs-orm/sqlite"]

# Forwarding 'postgres' to 'montrs-orm/postgres'
postgres = ["orm", "montrs-orm/postgres"]

# Forwarding 'e2e' to 'montrs-test/e2e'
e2e = ["test", "montrs-test/e2e"]

# Forwarding haptics platform features
haptics-web = ["haptics", "montrs-haptics/web"]
haptics-desktop = ["haptics", "montrs-haptics/desktop"]
haptics-mobile = ["haptics", "montrs-haptics/mobile"]
