[package]
name = "montrs-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Web platform adapter for MontRS — PlatformAdapter for browser/WASM targets"

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-platform"]

[dependencies]
montrs-platform = { path = "../platform" }
serde.workspace = true
thiserror.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Navigator"] }

[dev-dependencies]
tracing-subscriber = "0.3"
tracing = "0.1"

[features]
default = []