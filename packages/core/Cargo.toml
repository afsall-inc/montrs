[package]
name = "montrs-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[package.metadata.montrs]
layer = "0"
allowed_deps = ["montrs-platform"]

[dependencies]
montrs-platform = { path = "../platform" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.0", features = ["rt", "macros", "sync", "time"] }
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
futures.workspace = true
regex.workspace = true

leptos.workspace = true
leptos_router.workspace = true
leptos_hot_reload = { version = "0.8", optional = true }
leptos_axum = { workspace = true, optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["fs", "set-header", "compression-gzip"], optional = true }
tokio-tungstenite = { version = "0.29", optional = true }
reactive_graph = { version = "0.2", optional = true }

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

[features]
default = ["csr"]
csr = ["leptos/csr"]
ssr = [
    "leptos/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tower-http",
    "dep:leptos_hot_reload",
    "dep:tokio-tungstenite",
    "dep:reactive_graph",
]
