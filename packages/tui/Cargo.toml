[package]
name = "montrs-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MontRS Terminal UI library — ported from OpenTUI, tailored for MontRS"

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-platform"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
thiserror = "2"
anyhow.workspace = true
unicode-width = "0.2"
unicode-segmentation = "1.12"
tokio = { workspace = true, features = ["full"] }
montrs-platform = { path = "../platform" }

[dev-dependencies]
tempfile = "3"