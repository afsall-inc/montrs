[package]
name = "montrs-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Edge runtime adapter for MontRS — Cloudflare Workers, Deno, and other edge environments"

[package.metadata.montrs]
layer = "3"
allowed_deps = ["montrs-platform", "montrs-core"]

[dependencies]
montrs-platform = { path = "../platform" }
montrs-core = { path = "../core" }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber = "0.3"

[features]
default = []
cloudflare = []
deno = []