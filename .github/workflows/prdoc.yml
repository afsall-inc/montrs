name: PRDoc
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prdoc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install changelogger-cli
      - name: Generate prdoc
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          PRDOC="prdoc/pr_${PR_NUM}.prdoc"
          if [ ! -f "$PRDOC" ]; then
            changelogger prdoc generate --pr "$PR_NUM" --force
          fi
      - name: Validate and auto-fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
          if ! changelogger prdoc validate 2>&1; then
            python3 .github/scripts/autofix_prdoc.py "$PRDOC"
            changelogger prdoc validate
          fi
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Add prdoc for PR #${{ github.event.pull_request.number }}"
          file_pattern: "prdoc/*.prdoc"