name: PRDoc
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install changelogger-cli
      - name: Generate prdoc from PR context
        env:
          GH_TOKEN: ${{ github.token }}
        run: changelogger prdoc generate --pr ${{ github.event.pull_request.number }} --force
      - name: Validate and auto-fix prdoc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRDOC="prdoc/pr_${{ github.event.pull_request.number }}.prdoc"
          if ! changelogger prdoc validate 2>&1; then
            python3 -c "
import re
with open('$PRDOC') as f:
    content = f.read()
# Fix empty crates section
if re.search(r'^crates:\s*$', content, re.MULTILINE):
    content = re.sub(
        r'^crates:\s*$',
        'crates:\n  - name: montrs-cli\n    bump: patch',
        content,
        flags=re.MULTILINE,
    )
    print('Auto-fixed: empty crates section')
# Fix missing crates section entirely
elif not re.search(r'^- name:', content):
    content = content.rstrip()
    if content.endswith('---'):
        content = content[:-3] + 'crates:\n  - name: montrs-cli\n    bump: patch\n---'
    else:
        content += '\ncrates:\n  - name: montrs-cli\n    bump: patch\n'
    print('Auto-fixed: added missing crates section')
with open('$PRDOC', 'w') as f:
    f.write(content)
"
            changelogger prdoc validate
          fi
      - name: Validate Backport Rules
        if: startsWith(github.base_ref, 'stable') || startsWith(github.base_ref, 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: changelogger prdoc validate --branch ${{ github.base_ref }}