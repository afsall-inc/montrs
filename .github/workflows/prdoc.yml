name: PRDoc
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install changelogger-cli
      - name: Generate prdoc from PR context
        run: changelogger prdoc generate --pr ${{ github.event.pull_request.number }} --force
      - name: Validate prdoc
        run: changelogger prdoc validate
      - name: Validate Backport Rules
        if: startsWith(github.base_ref, 'stable') || startsWith(github.base_ref, 'release')
        run: changelogger prdoc validate --branch ${{ github.base_ref }}