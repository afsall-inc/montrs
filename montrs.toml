[project]
name = "montrs"
version = "0.1.0"

[env]
RUST_BACKTRACE = "1"
MONTRS_LOG = "info"

[tasks]
build = "cargo build --workspace"
fmt = "cargo fmt --all"
clippy = "cargo clippy --workspace -- -D warnings"
bench = "cargo run --package montrs-cli -- bench"
check = "cargo check"                               # default-members (fast)
check-full = "cargo check --workspace"              # full workspace (slow)
check-auth = "cargo check --package montrs-cli --features auth"
check-ssr = "cargo check -p website --features ssr"
check-wasm = "cargo check --target wasm32-unknown-unknown -p website --features hydrate --no-default-features"
check-cli = "cargo check -p montrs-core -p montrs-build -p montrs-cli -p montrs-metadata"
build-release = "cargo build --release --workspace"
clippy-core = "cargo clippy -p montrs-core -p montrs-build -p montrs-cli -p montrs-metadata -- -D warnings"

# Best-effort warm-up of the proc-macro crates that intermittently race on
# cold Windows/nightly parallel builds. Cargo's `-p` resolver panics on some
# of them (e.g. wasm-bindgen-test-macro), so each is built in a separate
# invocation and failures are tolerated.
[tasks.test-preflight]
description = "Warm racy proc-macro caches (Windows test race mitigation)"
command = "cargo build -p zerofrom-derive 1>NUL 2>NUL || true; cargo build -p windows-interface@0.57.0 -p windows-implement@0.57.0 1>NUL 2>NUL || true; cargo build -p windows-interface@0.59.3 -p windows-implement@0.60.2 1>NUL 2>NUL || true"

[tasks.test]
description = "Run all workspace tests"
command = "cargo test --workspace"
depends = ["test-preflight"]

[tasks.test-pkgs]
description = "Run tests for the packages with unit/integration tests (reliable on Windows)"
command = "cargo test -p montrs-core -p montrs-runner -p montrs-agent -p montrs-auth -p montrs-log -p montrs-services -p montrs-bench -p montrs-cli"

[tasks.dev]
description = "Start the development server"
command = "cargo run --package montrs-cli -- serve"

[tasks.serve-website]
description = "Serve the MontRS website"
command = "cd apps/website && cargo run --package montrs-cli -- serve"

[tasks.ci]
description = "Run all CI checks"
command = "echo 'CI checks complete'"
depends = ["fmt", "clippy", "check-auth", "test"]