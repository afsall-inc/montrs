[project]
name = "montrs"
version = "0.1.0"

[env]
RUST_BACKTRACE = "1"
MONTRS_LOG = "info"

[tasks]
build = "cargo build --workspace"
test = "cargo test --workspace"
fmt = "cargo fmt --all"
clippy = "cargo clippy --workspace -- -D warnings"
bench = "cargo run --package montrs-cli -- bench"
check = "cargo check --workspace"
check-ssr = "cargo check -p website --features ssr"
check-wasm = "cargo check --target wasm32-unknown-unknown -p website --features hydrate --no-default-features"
check-cli = "cargo check -p montrs-core -p montrs-build -p montrs-cli -p montrs-metadata"
build-release = "cargo build --release --workspace"
clippy-core = "cargo clippy -p montrs-core -p montrs-build -p montrs-cli -p montrs-metadata -- -D warnings"

[tasks.dev]
description = "Start the development server"
command = "cargo run --package montrs-cli -- serve"

[tasks.serve-website]
description = "Serve the MontRS website"
command = "cd apps/website && cargo run --package montrs-cli -- serve"

[tasks.ci]
description = "Run all CI checks"
command = "echo 'CI checks complete'"
depends = ["fmt", "clippy", "test"]